[project]
name = "ai-video-studio-backend"
version = "0.1.0"
description = "AI Video Studio backend: FastAPI, PostgreSQL, Dramatiq, Flow2API, FFmpeg composer"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "alembic>=1.14.0",
    "dramatiq[redis]>=1.17.0",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "pyjwt>=2.10.0",
    "python-multipart>=0.0.18",
    "pillow>=11.0.0",
    "boto3>=1.35.0",
]

[project.scripts]
studio = "app.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

